spring.profiles.active=dev

spring.servlet.multipart.max-file-size=50MB

springdoc.default-produces-media-type=application/json

server.servlet.context-path=/api/v1/


spring.application.name=language-school
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/language_school}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto=validate

# JWT configuration. The signing secret is supplied by the environment;
# no real secret is committed to the project. Use at least 32 UTF-8 bytes in production.
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:local-development-only-secret-change-me}
# Access tokens are short-lived and are renewed through a future refresh-token design.
app.security.jwt.access-token-ttl=PT1H


management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
